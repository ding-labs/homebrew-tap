name: Homebrew bottles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Released Ding version without v
        required: true
        default: '0.15.2'
permissions:
  contents: read
jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the reviewed formula
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          brew tap ding-labs/tap
          cp ding.rb "$(brew --repository ding-labs/tap)/ding.rb"
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula ding-labs/tap/ding
          fi
          brew info --json=v2 ding-labs/tap/ding | jq -e '.formulae[0].versions.stable == env.RELEASE_VERSION'
      # The install below reuses this checksum-verified archive. The public
      # step result lets the download report subtract one fetch on success.
      - name: Check the native archive cache
        id: archive
        run: |
          if [[ ! -f "$(brew --cache --build-from-source ding-labs/tap/ding)" ]]; then
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch Ding release archive v${{ inputs.version }} (${{ matrix.arch }})
        if: steps.archive.outputs.missing == 'true'
        run: brew fetch --build-bottle ding-labs/tap/ding
      - name: Install and exercise the complete package
        run: |
          brew install --build-bottle ding-labs/tap/ding
          brew test ding-labs/tap/ding
          ding version --json
      - name: Create a relocatable Homebrew bottle
        run: |
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/ding-labs/ding/releases/download/v$RELEASE_VERSION" \
            ding-labs/tap/ding
      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.arch }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error
# Review the JSON and publish its named files to the matching Ding release, then
# merge the generated bottle blocks into ding.rb. Never rebuild release binaries.
